services:
  postgres:
    image: postgres:16
    container_name: netmaster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netmaster
      POSTGRES_PASSWORD: netmaster_dev
      POSTGRES_DB: netmaster
    ports:
      - "5432:5432"
    volumes:
      - netmaster_pgdata:/var/lib/postgresql/data

volumes:
  netmaster_pgdata:
